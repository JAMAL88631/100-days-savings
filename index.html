<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 Days Savings Challenge</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 500px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 5px;
        }

        .target {
            font-size: 18px;
            color: #555;
        }

        .amount {
            font-size: 40px;
            font-weight: bold;
            margin: 20px 0;
        }

        .progress {
            background: #ddd;
            border-radius: 20px;
            height: 20px;
            overflow: hidden;
        }

        .progress-bar {
            background: #2196f3;
            height: 100%;
            width: 0%;
        }

        button {
            margin-top: 25px;
            padding: 15px 25px;
            border: none;
            border-radius: 12px;
            background: #2196f3;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #1976d2;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>💰 100 Days Savings</h1>

        <p class="target">
            KSh 50 each per day
        </p>

        <div class="amount">
            KSh 0
        </div>

        <p>Combined target: KSh 10,000</p>

        <div class="progress">
            <div class="progress-bar"></div>
        </div>

        <p>Day 0 / 100</p>

        <button onclick="saveMoney()">
    ✅ I Saved KSh 50
</button>

<script>
let saved = Number(localStorage.getItem("saved")) || 0;
let day = Number(localStorage.getItem("day")) || 0;

function updateScreen() {
    document.querySelector(".amount").textContent =
        "KSh " + saved.toLocaleString();

    document.querySelector(".progress-bar").style.width =
        (saved / 10000 * 100) + "%";

    document.querySelector(".card p:nth-of-type(2)").textContent =
        "Day " + day + " / 100";
}

function saveMoney() {
    if (day >= 100) {
        alert("🎉 Challenge completed!");
        return;
    }

    saved += 50;
    day++;

    localStorage.setItem("saved", saved);
    localStorage.setItem("day", day);

    updateScreen();

    alert("✅ KSh 50 recorded!");
}

updateScreen();
</script>

    </div>

</div>

</body>
</html>
