<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>100 Days Savings</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 500px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            margin-top: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 5px;
        }

        .amount {
            font-size: 40px;
            font-weight: bold;
            margin: 20px 0;
        }

        .progress {
            background: #ddd;
            height: 20px;
            border-radius: 20px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-bar {
            background: #2196f3;
            height: 100%;
            width: 0%;
            transition: width 0.5s;
        }

        button {
            margin-top: 20px;
            padding: 15px 25px;
            border: none;
            border-radius: 12px;
            background: #2196f3;
            color: white;
            font-size: 17px;
        }

        button:active {
            transform: scale(0.97);
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>💰 100 Days Savings</h1>

        <p>KSh 50 each per day</p>

        <div class="amount" id="amount">
            KSh 0
        </div>

        <p id="day">
            Day 0 / 100
        </p>

        <p>
            Target: KSh 10,000
        </p>

        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <p id="percentage">
            0% completed
        </p>

        <button onclick="saveMoney()">
            ✅ I Saved KSh 50
        </button>

    </div>

</div>

<script>

let saved = Number(localStorage.getItem("saved")) || 0;
let day = Number(localStorage.getItem("day")) || 0;

function updateScreen() {

    document.getElementById("amount").textContent =
        "KSh " + saved.toLocaleString();

    document.getElementById("day").textContent =
        "Day " + day + " / 100";

    let percentage = (saved / 10000) * 100;

    document.getElementById("progressBar").style.width =
        percentage + "%";

    document.getElementById("percentage").textContent =
        percentage.toFixed(1) + "% completed";
}

function saveMoney() {

    if (day >= 100) {
        alert("🎉 You have completed the 100-day challenge!");
        return;
    }

    saved = saved + 50;
    day = day + 1;

    localStorage.setItem("saved", saved);
    localStorage.setItem("day", day);

    updateScreen();

    alert("✅ KSh 50 recorded!");
}

updateScreen();

</script>

</body>
</html>
